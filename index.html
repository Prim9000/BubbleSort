<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SortLength Lab: bubble sort words by length</title>
<meta name="description" content="Interactive practice for SortLength: bubble sort words by len(), with a Swap flag and a Count limit. Drag the cards and watch y, Swap and Count change.">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fff;--fg:#12332b;--mut:#4f6760;--panel:#ffffff;--blue:#2a78a8;--org:#f2af34;--red:#dd4b2f;--grn:#2e7d63;--code:#12332b;--line:#6e8b80;--card:#fff;--ink:#12332b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 Calibri,"Segoe UI",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:20px 16px 40px}
h1{font:700 30px/1.15 Cambria,Georgia,serif;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 14px}
#stage{position:relative;background:var(--panel);outline:1px solid #cfe0d7;border-radius:12px;overflow:hidden;touch-action:pan-x pan-y;user-select:none;min-width:600px}
.sw{overflow-x:auto;border-radius:12px}
.zone,.zl,.slot,.idx{pointer-events:none}
.zone{position:absolute;left:8px;right:8px;top:26px;border:2px dashed var(--line);border-radius:10px;opacity:.55}
.zl{position:absolute;left:14px;top:5px;font-size:13px;color:var(--mut)}
.slot{position:absolute;border:1.5px dashed var(--line);border-radius:8px;opacity:.35}
.slot.gap{border-color:var(--org);border-width:2.5px;opacity:1}
.slot.tgt{background:color-mix(in srgb,var(--org) 35%,transparent)}
.idx{position:absolute;text-align:center;font-size:14px;font-weight:700;color:var(--grn)}
.badge{position:absolute;z-index:3;font-size:12px;height:24px;border-radius:6px;color:#fff;font-weight:700;text-align:center;line-height:24px;transition:left .35s}
.card{position:absolute;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;font:700 26px Calibri,sans-serif;background:var(--card);border:1.5px solid var(--line);border-radius:10px;cursor:grab;transition:left .35s,top .35s,background .2s;touch-action:none}
.card.sorted{background:var(--blue);color:#fff;border-color:var(--blue)}
.card.cur{background:var(--red);color:#fff;border:3px solid var(--red)}
.card b{font:700 26px/1.1 Calibri,sans-serif}.card small{font:600 11px/1.2 Calibri,sans-serif;max-width:94%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card.drag{transition:none;z-index:9;cursor:grabbing;box-shadow:0 6px 16px #0005}
.badge.mv{cursor:grab;animation:p .9s infinite}.badge.pulse{animation:p .7s 3}.badge.drag{transition:none;z-index:9}
.card.pulse{animation:p .7s 3}
.card.shake{animation:s .35s}
@keyframes p{50%{box-shadow:0 0 0 6px var(--org)}}
@keyframes s{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){.card,.badge{transition:none}.card.pulse,.card.shake,.badge.mv,.badge.pulse{animation:none}}
#vars{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.v{border-radius:10px;padding:8px;text-align:center;color:#fff}
.v b{display:block;font-size:13px}.v span{font:700 24px Consolas,"Courier New",monospace}
#msg{min-height:3.2em;padding:10px 12px;border-radius:10px;background:var(--panel);outline:1px solid #cfe0d7;border-left:5px solid var(--line)}
#msg.ok{border-color:var(--grn)}#msg.err{border-color:var(--red)}
#test{font:14px Consolas,"Courier New",monospace;color:var(--mut);margin:8px 0;min-height:1.5em}
#trace{display:flex;gap:12px;align-items:flex-start;padding:4px 2px}
.tcol div{width:50px;height:26px;line-height:24px;text-align:center;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:13px;white-space:nowrap}
.tcol div.s{background:var(--blue);color:#fff}.tcol div.r{background:var(--red);color:#fff}
.tcol.pos div{border:0;background:none;width:auto;min-width:92px;text-align:left;color:var(--mut);font-weight:400}
.key{display:flex;gap:14px;flex-wrap:wrap;margin:8px 0 14px;font-size:14px}.key span{display:inline-block;width:14px;height:14px;border:1px solid var(--line);vertical-align:-2px;margin-right:5px}
h2{font:700 20px Cambria,Georgia,serif;margin:18px 0 4px}
.t{color:var(--grn);font-weight:700}.f{color:var(--red);font-weight:700}
.btns{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,select{font:inherit;padding:8px 14px;border-radius:8px;border:1.5px solid var(--grn);background:var(--bg);color:var(--fg);cursor:pointer}
button.pri{background:var(--grn);color:#fff}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.wrap{overflow-x:auto}
pre{margin:0;background:var(--code);color:#fff;border-radius:12px;padding:12px 0;font:13px/1.65 Consolas,"Courier New",monospace;min-width:660px}
pre i{display:block;padding:0 16px;font-style:normal;white-space:pre}
pre i.hl{background:#f2af3440;box-shadow:inset 3px 0 var(--org)}
pre i.ran{background:#2e7d6366}
.k{color:#f2af34;font-weight:700}.n{color:#f9dda6}
#stats{color:var(--mut);margin-top:10px}
</style></head><body><main>
<h1>SortLength Lab</h1>
<div class="sw"><div id="stage" aria-label="Card table"></div></div>
<div id="vars"></div>
<div id="msg" role="status" aria-live="polite"></div>
<div id="test"></div>
<div class="btns">
<button id="hint">Hint</button><button id="auto" class="pri">Do the next move</button><button id="reset">Restart</button>
<button id="new">New cards</button>
<label>Numbers <select id="size"><option value="cl">Set 1: Mixed lengths (15 cards)</option><option value="t19">Set 2: Almost sorted (stops early)</option><option value="rev">Set 3: Shortest word last (hits Count = 14)</option><option value="r6">Random (15 cards)</option></select></label>
<label><input type="checkbox" id="showtest" checked> Show the if test</label>
<label><input type="checkbox" id="autoy" checked> Move y for me after a swap</label>
</div>
<h2>Your sort, pass by pass</h2><div class="key"><div><span style="background:var(--blue)"></span>Sorted</div><div><span style="background:var(--red)"></span>Pair being compared</div><div><span></span>Unsorted</div></div><div class="sw"><div id="trace"></div></div>
<div class="wrap"><pre id="code" aria-label="Python code"></pre></div>
<p class="sub" style="margin-top:10px">DataArray is a global list of 15 strings. <code>Swap = True</code> sits inside the <code>if</code>, and <code>Count = Count + 1</code> sits at the end of the while body (the indentation was lost in the pasted code).</p>
<div id="stats"></div>
</main>
<script>
const CODE=["def SortLength():","    Swap = True","    Count = 0","    while(Count < 14 and Swap):","        Swap = False","        for y in range(14):","            if(len(DataArray[y]) > len(DataArray[y+1])):","                DataArray[y], DataArray[y+1] = DataArray[y+1], DataArray[y]","                Swap = True","        Count = Count + 1"];
const $=id=>document.getElementById(id), stage=$("stage"), LIM=14;
let shk=null,cards,cells,Count,Swap,i,sf,phase,st,hl,ran,msg,kind,trace,L={},els={},drag=null,hintId=null;
const len=id=>cards[id].w.length, wd=id=>cards[id].w, A=()=>len(cells[i]), B=()=>len(cells[i+1]), GT=()=>A()>B();
function init(arr){cards=arr.map((w,k)=>({id:k,w}));cells=arr.map((_,k)=>k);Count=0;Swap=false;i=0;sf=arr.length;phase="compare";st={c:0,s:0,m:0};hl=[6];ran=[1,2,3,4,5];hintId=null;trace=[{v:arr.slice(),sf}];
 stage.style.minWidth=(arr.length*64+16)+"px";
 Object.values(els).forEach(e=>e.remove());els={};cards.forEach(c=>{const e=document.createElement("div");e.className="card";e.dataset.id=c.id;e.innerHTML=`<b>${c.w.length}</b>`;stage.appendChild(e);els[c.id]=e});
 say("Start: Swap = True, Count = 0. The while test Count < 14 and Swap is True, so Swap = False and the for loop begins at y = 0. "+ask(),"info");render()}
function ask(){return `y = ${i}: is len(DataArray[y]) = ${A()} greater than len(DataArray[y+1]) = ${B()}? If True, drag the left card one slot right to swap the pair. If False, drag the green y badge one slot right.`}
function say(t,k){msg=t;kind=k}
function geo(){const n=cells.length,W=stage.clientWidth,p=Math.min(88,(W-16)/n),cw=p*.8,ch=cw*1.25;
 L={n,W,p,cw,ch,l0:(W-n*p)/2,ry:22};L.H=L.ry+ch+70;return L}
const sx=k=>L.l0+k*L.p+(L.p-L.cw)/2;
const canBadge=()=>phase==="advance"||(phase==="compare"&&!GT());
function render(){geo();stage.style.height=L.H+"px";
 stage.querySelectorAll(".slot,.idx").forEach(e=>e.remove());
 const nx=nextMove();
 for(let k=0;k<L.n;k++)stage.insertAdjacentHTML("beforeend",`<div class="slot${hintId!==null&&nx.tgt&&nx.tgt.i===k?" tgt":""}" style="left:${sx(k)}px;top:${L.ry}px;width:${L.cw}px;height:${L.ch}px"></div><div class="idx" style="left:${sx(k)}px;top:${L.ry+L.ch+4}px;width:${L.cw}px">[${k}]</div>`);
 const inPair=phase==="compare";
 cards.forEach(c=>{const e=els[c.id],k=cells.indexOf(c.id);if(e===(drag&&drag.el))return;
  e.style.width=L.cw+"px";e.style.height=L.ch+"px";
  e.style.left=sx(k)+"px";e.style.top=L.ry+"px";
  e.className="card"+(k>=sf?" sorted":inPair&&(k===i||k===i+1)?" cur":"")+(c.id===hintId?" pulse":"")+(c.id===shk?" shake":"")});
 bdg(i);
 const V=[["Count",Count,"var(--blue)"],["Swap",Swap?"True":"False","#f2af34;color:#12332b"],["y",i,"var(--grn)"],["len test",phase==="compare"?`${A()} > ${B()}`:"—","var(--mut)"]];
 $("vars").innerHTML=V.map(v=>`<div class="v" style="background:${v[2]}"><b>${v[0]}</b><span>${v[1]}</span></div>`).join("");
 const m=$("msg");m.textContent=msg;m.className=kind;
 $("code").innerHTML=CODE.map((l,k)=>`<i class="${hl.includes(k)?"hl":ran.includes(k)?"ran":""}">${l.replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/\b(def|while|for|in|if|and|True|False)\b/g,'<span class="k">$1</span>').replace(/\b(\d+)\b/g,'<span class="n">$1</span>')}</i>`).join("");
 let t="";if($("showtest").checked&&phase==="compare"){const g=GT();
  t=`len(DataArray[y]) > len(DataArray[y+1]) → ${A()} > ${B()} → <span class="${g?"t":"f"}">${g?"True: swap":"False: no swap"}</span>`}
 $("test").innerHTML=t;
 $("stats").textContent=`Comparisons: ${st.c} · Swaps: ${st.s} · Passes (Count): ${Count} · Mistakes: ${st.m}`;$("hint").disabled=$("auto").disabled=phase==="done";renderTrace()}
function renderTrace(){const n=cards.length,cols=trace.slice(),inPair=phase==="compare";
 if(phase!=="done")cols.push({v:cells.map(wd),sf,live:1});
 let h=`<div class="tcol pos"><div><b>Position number</b></div>${[...Array(n).keys()].map(k=>`<div>${k}</div>`).join("")}</div>`;
 cols.forEach((c,ci)=>{h+=`<div class="tcol"><div>${ci===0?"Start":c.live?"Now":"Pass "+ci}</div>${c.v.map((w,k)=>`<div class="${k>=c.sf?"s":c.live&&inPair&&(k===i||k===i+1)?"r":""}">${w.length}</div>`).join("")}</div>`});
 $("trace").innerHTML=h}
function bdg(k){let e=stage.querySelector(".by");if(!e){e=document.createElement("div");e.className="badge by";e.textContent="y";stage.appendChild(e)}
 const w=24;e.style.cssText=`left:${sx(k)+L.cw/2-w/2}px;top:${L.ry+L.ch+26}px;width:${w}px;background:var(--grn)`;
 e.classList.toggle("mv",phase!=="done"&&canBadge());e.classList.toggle("pulse",hintId==="y")}
function nextMove(){if(phase==="done")return{};
 if(phase==="compare")return GT()?{id:cells[i],tgt:{t:"slot",i:i+1},text:`${A()} > ${B()} is True, so swap: drag the ${A()} one slot right.`}:{id:"y",tgt:{t:"slot",i:i+1},text:`${A()} > ${B()} is False, so no swap: drag the green y badge one slot right.`};
 return{id:"y",tgt:{t:"slot",i:i+1},text:"Drag the green y badge one slot right (next y in range(14))."}}
function bad(t,id){st.m++;say(t,"err");shk=id;setTimeout(()=>{shk=null},450)}
function step(pre){pre=pre||"";i++;
 if(i<LIM){phase="compare";hl=[6];ran=[5];say(pre+ask(),"ok");return}
 i=LIM-1;Count++;sf=Math.max(0,cells.length-Count);
 const cond=Count<LIM&&Swap,why=`Count = Count + 1 = ${Count}. The while test: Count < 14 and Swap → ${Count} < 14 and ${Swap?"True":"False"} → ${cond?"True":"False"}. `;
 if(cond){trace.push({v:cells.map(wd),sf});Swap=false;i=0;phase="compare";hl=[6];ran=[5,9,3,4];say(pre+`The for loop is finished (range(14) is used up). ${why}Swap = False and a new pass starts at y = 0. ${ask()}`,"ok")}
 else{sf=0;trace.push({v:cells.map(wd),sf});phase="done";hl=[];ran=[5,9,3];say(pre+`The for loop is finished. ${why}The loop ends: the list is sorted by length after ${Count} pass${Count>1?"es":""}. Note: range(14) never shrinks, so every pass compares all 14 pairs (${st.c} comparisons), even the blue cards.`,"ok")}}
function attempt(id,tg){ran=[];hintId=null;const cell=cells.indexOf(id),slot=tg.i;
 if(phase==="advance"){if(id==="y"&&slot===i+1)step();else bad("Now move the green y badge one slot to the right (next y in range(14)).",id);return}
 if(id==="y"){if(!GT()&&slot===i+1){st.c++;step()}else if(GT())bad(`${A()} > ${B()} is True, so swap the pair first: drag the ${A()} one slot right.`,id);else bad("Move the green y badge exactly one slot to the right.",id);return}
 if(!GT())return bad(`${A()} > ${B()} is False${A()===B()?" (equal lengths are never swapped, which keeps the sort stable)":""}, so there is nothing to swap. Drag the green y badge one slot right.`,id);
 if((id===cells[i]&&slot===i+1)||(id===cells[i+1]&&slot===i)){st.c++;st.s++;[cells[i],cells[i+1]]=[cells[i+1],cells[i]];Swap=true;
  const pre=`Swapped: DataArray[y], DataArray[y+1] = DataArray[y+1], DataArray[y], then Swap = True. `;
  if($("autoy").checked){ran=[7,8];step(pre)}else{phase="advance";hl=[5];ran=[7,8];say(pre+"The for loop moves on: drag the green y badge one slot right.","ok")}}
 else bad(`${A()} > ${B()} is True. Drag the left card (${A()}) one slot right, or the right card (${B()}) one slot left, to swap the pair.`,id)}
stage.addEventListener("pointerdown",e=>{const el=e.target.closest(".card,.badge");if(!el||phase==="done")return;const isB=!el.classList.contains("card");if(isB&&!canBadge())return;const r=el.getBoundingClientRect();
 drag={el,id:isB?"y":+el.dataset.id,ox:e.clientX-r.left,oy:e.clientY-r.top,sx:e.clientX,sy:e.clientY};el.setPointerCapture(e.pointerId);el.classList.add("drag")});
stage.addEventListener("pointermove",e=>{if(!drag)return;const r=stage.getBoundingClientRect();drag.el.style.left=e.clientX-r.left-drag.ox+"px";drag.el.style.top=e.clientY-r.top-drag.oy+"px"});
stage.addEventListener("pointerup",e=>{if(!drag)return;const d=drag;drag=null;d.el.classList.remove("drag");
 const moved=Math.hypot(e.clientX-d.sx,e.clientY-d.sy)>6,r=stage.getBoundingClientRect(),b=d.el.getBoundingClientRect(),cx=b.left+b.width/2-r.left;
 let tg;if(!moved)tg={t:"slot",i:d.id==="y"?i+1:(cells.indexOf(d.id)===i?i+1:i)};
 else tg={t:"slot",i:Math.max(0,Math.min(L.n-1,Math.floor((cx-L.l0)/L.p)))};
 attempt(d.id,tg);render()});
$("hint").onclick=()=>{const m=nextMove();hintId=m.id;say("Hint: "+m.text,"info");render()};
$("auto").onclick=()=>{const m=nextMove();attempt(m.id,m.tgt);render()};
$("reset").onclick=()=>init(cards.map(c=>c.w));
const POOL="fig pear kiwi plum date lime apple grape lemon mango melon peach banana cherry papaya apricot orange coconut avocado guava lychee olive berry nut pea yam bean".split(" ");
const SETS={cl:"banana kiwi apple fig cherry plum grape lemon pear mango melon lime peach date papaya".split(" "),
 t19:"pear fig kiwi date lime plum apple grape lemon mango melon peach banana cherry papaya".split(" "),
 rev:"banana cherry papaya apple grape lemon mango melon peach kiwi plum pear date lime fig".split(" ")},
 pick=()=>SETS[$("size").value]||POOL.slice().sort(()=>Math.random()-.5).slice(0,15);
$("new").onclick=()=>{$("size").value="r6";init(pick())};$("size").onchange=()=>init(pick());
$("showtest").onchange=render;addEventListener("resize",render);
init(pick());
</script></body></html>
